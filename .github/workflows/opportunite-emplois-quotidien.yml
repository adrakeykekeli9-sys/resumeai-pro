name: Opportunité d'Emplois – mise à jour quotidienne

# Tourne chaque matin sur les serveurs de GitHub, sans session Claude Code.
# Puis Render remet le site en ligne grâce au secret RENDER_DEPLOY_HOOK (Render > Settings > Deploy Hook).
on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC = 04:17 à Lomé
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: opportunite-emplois-quotidien
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sites/opportunite-emplois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer le SDK Claude
        run: pip install anthropic
      - name: Collecter et vérifier les offres
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
        run: python3 -I scripts/auto_update.py
      - name: Construire le site (contrôle)
        env:
          SITE_URL: https://opportunite-emplois.org
        run: node build.mjs
      - name: Publier
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
        run: |
          git config user.name "opportunite-emplois-bot"
          git config user.email "opportunite-emplois-bot@users.noreply.github.com"
          MSG="Mise à jour automatique du $(date -u +%d/%m/%Y)"
          git add data
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -qm "$MSG"
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase origin/main; then
              git push origin HEAD:main && { echo "Publié"; exit 0; }
            else
              # Une autre mise à jour a été publiée entre-temps (par exemple la routine manuelle) :
              # on repart de sa version et on relance la collecte, qui ignore les annonces déjà vues.
              echo "::warning::Conflit avec une autre mise à jour : nouvelle collecte sur la dernière version"
              git rebase --abort
              git reset -q --hard origin/main
              python3 -I scripts/auto_update.py
              git add data
              if git diff --cached --quiet; then echo "Rien de nouveau après la mise à jour déjà publiée"; exit 0; fi
              git commit -qm "$MSG"
            fi
            sleep 10
          done
          echo "::error::Impossible de publier la mise à jour"; exit 1
      - name: Remettre le site en ligne (Render)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo "::warning::Secret RENDER_DEPLOY_HOOK absent : le site n'est pas redéployé"; exit 0; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null && echo "Déploiement Render demandé"
